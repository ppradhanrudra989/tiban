<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flipkart Clone</title>
  <link rel="stylesheet" href="25mays.css" />


  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>


  <nav class="navbar">
    <div class="logo">
      <img src="https://logos-world.net/wp-content/uploads/2020/11/Flipkart-Logo.png" alt="logo">
    </div>

    <div class="search-box">
      <i class="fa fa-search"></i>
      <input type="text" placeholder="Search for Products, Brands and More">
    </div>

    <div class="nav-right">
      <div class="nav-item">
        <i class="fa-regular fa-user"></i>
        Login
      </div>

      <div class="nav-item">
        More
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-cart-shopping"></i>
        Cart
      </div>
    </div>
  </nav>

  <!-- Categories -->
  <section class="categories">
    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/25/25694.png">
      <p>For You</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/892/892458.png">
      <p>Fashion</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/15/15874.png">
      <p>Mobiles</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/2874/2874803.png">
      <p>Beauty</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/1041/1041888.png">
      <p>Electronics</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/1946/1946436.png">
      <p>Home</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/3659/3659898.png">
      <p>Appliances</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/616/616408.png">
      <p>Toys</p>
    </div>

    <div class="cat-item">
      <img src="https://cdn-icons-png.flaticon.com/128/5787/5787016.png">
      <p>Sports</p>
    </div>
  </section>

  <!-- Banner Section -->
  <section class="banner-section">

    <div class="banner-card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/1600/270/image/4f2a4c537e5b7f63.jpg?q=20" alt="banner">
    </div>

    <div class="banner-card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/1600/270/image/38d33f9e31f8fd0f.jpg?q=20" alt="banner">
    </div>

    <div class="banner-card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/1600/270/image/57f5e6c80df2e8c7.jpg?q=20" alt="banner">
    </div>

  </section>

  <!-- Bottom Cards -->
  <section class="small-cards">

    <div class="card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/520/280/image/6c1d59f6fba9b5b7.jpg?q=20">
    </div>

    <div class="card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/520/280/image/0ef9cb8d2fa6b5f4.jpg?q=20">
    </div>

    <div class="card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/520/280/image/9d4f65ef7b5f9c7a.jpg?q=20">
    </div>

    <div class="card">
      <img src="https://rukminim2.flixcart.com/fk-p-flap/520/280/image/8b18f5f03f4b6f53.jpg?q=20">
    </div>

  </section>

</body>
</html>
